name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Validate tag matches package version
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        VERSION=$(node -p "require('./package.json').version")
        if [ "$TAG" != "$VERSION" ]; then
          echo "Tag v$TAG does not match package.json version $VERSION"
          exit 1
        fi
        echo "Release tag/version OK: v$VERSION"

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Build Electron app
      run: npm run electron:build -- --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Rename Windows release artifacts
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $version = node -p "require('./package.json').version"
        $exe = Get-ChildItem dist-electron -Filter '*.exe' | Select-Object -First 1
        $zip = Get-ChildItem dist-electron -Filter '*-win.zip' | Select-Object -First 1
        if ($exe) { Rename-Item $exe.FullName "Snowflake-Generator-Windows-Installer-$version.exe" }
        if ($zip) { Rename-Item $zip.FullName "Snowflake-Generator-Windows-Portable-$version.zip" }

    - name: Rename macOS release artifacts
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        VERSION=$(node -p "require('./package.json').version")
        for file in dist-electron/*.dmg; do
          [ -e "$file" ] && mv "$file" "dist-electron/Snowflake-Generator-macOS-Installer-${VERSION}.dmg"
        done
        for file in dist-electron/*-mac.zip; do
          [ -e "$file" ] && mv "$file" "dist-electron/Snowflake-Generator-macOS-Portable-${VERSION}.zip"
        done

    - name: Rename Linux release artifacts
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        VERSION=$(node -p "require('./package.json').version")
        for file in dist-electron/*.AppImage; do
          [ -e "$file" ] && mv "$file" "dist-electron/Snowflake-Generator-Linux-Portable-${VERSION}.AppImage"
        done
        for file in dist-electron/*.deb; do
          [ -e "$file" ] && mv "$file" "dist-electron/Snowflake-Generator-Linux-Installer-${VERSION}.deb"
        done
        for file in dist-electron/*.tar.gz; do
          [ -e "$file" ] && mv "$file" "dist-electron/Snowflake-Generator-Linux-Portable-${VERSION}.tar.gz"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: ${{ matrix.os }}-build
        path: dist-electron/

  build-web:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build browser-only app
      run: npm run build:web

    - name: Package web build
      run: |
        VERSION=$(node -p "require('./package.json').version")
        cd dist-web
        zip -r "../Snowflake-Generator-Web-Portable-${VERSION}.zip" .

    - name: Upload web build
      uses: actions/upload-artifact@v5
      with:
        name: web-build
        path: Snowflake-Generator-Web-Portable-*.zip

  release:
    needs: [build, build-web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: release-assets
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-assets/**/*Windows-Installer*.exe
          release-assets/**/*Windows-Portable*.zip
          release-assets/**/*macOS-Installer*.dmg
          release-assets/**/*macOS-Portable*.zip
          release-assets/**/*Linux-Portable*.AppImage
          release-assets/**/*Linux-Installer*.deb
          release-assets/**/*Linux-Portable*.tar.gz
          release-assets/**/*Web-Portable*.zip
          !release-assets/**/*.blockmap
          !release-assets/**/builder-debug.yml
          !release-assets/**/builder-effective-config.yaml
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
